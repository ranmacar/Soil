<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12160f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SOIL map</title>
  </head>
  <body>
    <div id="map"></div>
    <header class="chrome">
      <span class="wordmark">SOIL</span>
      <p id="status" class="status" hidden></p>
      <p id="cell" class="cell">H3 r10</p>
    </header>
    <div id="view3d" class="view3d" aria-hidden="true">
      <div id="view3d-canvas" class="view3d-canvas"></div>
      <button type="button" id="view3d-close" class="view3d-close">Close</button>
      <p id="view3d-label" class="view3d-label"></p>
      <p id="view3d-error" class="view3d-error" hidden></p>
      <div id="view3d-credits" class="view3d-credits"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
